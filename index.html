<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa Story</title>
    
    <!-- CARGA DE LA LIBRERÍA -->
    <script src="https://cloudflare.com"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- CONTENEDOR DONDE SE VE EL MAPA -->
    <div id="viewer"></div>

    <script>
        var viewer = OpenSeadragon({
            id: "viewer",
            // Iconos de la interfaz
            prefixUrl: "https://cloudflare.com",
            
            tileSources: {
                type: 'zoomifytileservice',
                // ESTA ES LA RUTA A TU REPOSITORIO
                url: 'https://github.io'
            },
            
            showNavigator: true,
            gestureSettingsMouse: { clickToZoom: true }
        });
    </script>

</body>
</html>
