<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Mapa de Alta Resolución</title>
    <script src="https://cloudflare.com"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

<div id="viewer"></div>

<script>
    var viewer = OpenSeadragon({
        id: "viewer",
        prefixUrl: "https://github.io",
        showNavigator: true,
        tileSources: {
            type: 'xml',
            url: './ImageProperties.xml' 
        }
    });

    // Forzamos la lectura si el XML falla por seguridad en GitHub
    viewer.addHandler('open-failed', function(event) {
        console.log("Reintentando carga manual...");
        // Si el XML falla, intenta cargar el primer TileGroup directamente
        viewer.open({
            type: 'image',
            url: 'TileGroup0/0-0-0.jpg' // Verifica si tus fotos terminan en .jpg o .png
        });
    });
</script>

</body>
</html>
