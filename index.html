<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa Story</title>
    
    <!-- ESTA ES LA PIEZA QUE FALTA (LA LIBRERÍA) -->
    <script src="https://cloudflare.com"></script>

    <style>
        /* Esto hace que el mapa se vea en toda la pantalla */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Aquí es donde se dibujará el mapa -->
    <div id="viewer"></div>

    <script>
        // Configuración para cargar tu mapa específico
        var viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cloudflare.com",
            tileSources: {
                type: 'zoomifytileservice',
                url: 'https://github.io'
            }
        });
    </script>

</body>
</html>
