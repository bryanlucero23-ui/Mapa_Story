<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa Story</title>
    
    <!-- 1. CARGA DE LA LIBRERÍA (Arregla el error 'OpenSeadragon is not defined') -->
    <script src="https://cloudflare.com"></script>

    <style>
        /* Estilo para que el mapa ocupe toda la pantalla */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- 2. CONTENEDOR DEL MAPA -->
    <div id="viewer"></div>

    <!-- 3. CONFIGURACIÓN DEL VISOR -->
    <script>
        var viewer = OpenSeadragon({
            id: "viewer",
            // Iconos de los botones (zoom, pantalla completa, etc.)
            prefixUrl: "https://cloudflare.com",
            
            // Fuente de las imágenes (tu archivo XML en la raíz)
            tileSources: {
                type: 'zoomifytileservice',
                url: 'https://github.io'
            },
            
            // Opciones extras recomendadas
            showNavigator: true,
            showReferenceStrip: false,
            gestureSettingsMouse: { clickToZoom: true }
        });
    </script>

</body>
</html>
