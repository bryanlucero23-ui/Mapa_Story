<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Mapa de Alta Resolución</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="viewer"></div>

<script>
    var viewer = OpenSeadragon({
        id: "viewer",
        prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
        showNavigator: true,
        tileSources: {
            type: 'zoomifytileservice',
            url: 'https://bryanlucero23-ui.github.io/Mapa_Story/'
        }
    });
</script>

</body>
</html>
