<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Mapa de Alta Resolución</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #viewer { width: 100%; height: 100vh; background: #000; }
    </style>
</head>
<body>

<div id="viewer"></div>

<script>
    var viewer = OpenSeadragon({
        id: "viewer",
        prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
        showNavigator: true, // Útil para mapas grandes
        tileSources: {
            // Indicamos que es un formato XML de Deep Zoom
            type: 'xml',
            url: './ImageProperties.xml', // Ruta al archivo que se ve en tu imagen
            
            // Opcional: Si el XML no tiene definidos los paths correctamente, 
            // OpenSeadragon buscará las carpetas TileGroup en el mismo nivel.
        }
    });
</script>

</body>
</html>
